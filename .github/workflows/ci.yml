name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live API tests (needs the TYPESAFE_API_KEY secret)"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 14
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++-14
          - name: Linux Clang 18
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=clang++-18
          - name: macOS Clang
            os: macos-15
          - name: Windows MSVC
            os: windows-2022
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install curl nlohmann-json --triplet x64-windows
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --parallel 4 -LE live

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      # -fno-sanitize=vptr: libtypesafe (a dependency) is built without RTTI, which UBSan's vptr
      # check needs, so it would report false positives on objects created inside it.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-18
          -DLIBSEMOP_BUILD_EXAMPLES=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.sanitizer }} -fno-sanitize=vptr -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build --parallel --target libsemop_tests libsemop_typesafe_tests
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ./build/tests/libsemop_tests
          ./build/tests/libsemop_typesafe_tests

  live:
    name: Live API
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-24.04
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      LIBSEMOP_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLIBSEMOP_BUILD_EXAMPLES=OFF
      - run: cmake --build build --parallel --target libsemop_live_tests
      - run: ./build/tests/libsemop_live_tests
